<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wmux</title>
<!-- xterm.js — bundled locally (CDN blocked by Tauri WebView2 sandbox) -->
<link rel="stylesheet" href="vendor/xterm.min.css">
<script src="vendor/xterm.min.js"></script>
<script src="vendor/addon-fit.min.js"></script>
<script src="vendor/addon-webgl.min.js"></script>
<script src="vendor/addon-web-links.min.js"></script>
<style>
  :root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --bg-tertiary: #1c2128;
    --border: #30363d;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #484f58;
    --accent: #58a6ff;
    --accent-glow: rgba(88,166,255,0.3);
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
    --orange: #f0883e;
    --cyan: #39d353;
    --ring-blue: #58a6ff;
    --ring-glow: rgba(88,166,255,0.4);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',-apple-system,sans-serif; background:var(--bg-primary); color:var(--text-primary); overflow:hidden; height:100vh; width:100vw; }
  .app { display:flex; height:100vh; width:100vw; }

  /* SIDEBAR */
  .sidebar { width:240px; min-width:240px; background:var(--bg-primary); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
  .sidebar-header { padding:12px 14px 8px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
  .sidebar-logo { font-size:15px; font-weight:700; letter-spacing:1.5px; color:var(--accent); display:flex; align-items:center; gap:8px; }
  .sidebar-logo svg { width:20px; height:20px; }
  .sidebar-actions { display:flex; gap:4px; }
  .sidebar-actions button { background:none; border:1px solid var(--border); color:var(--text-secondary); width:26px; height:26px; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; transition:all 0.15s; }
  .sidebar-actions button:hover { background:var(--bg-tertiary); color:var(--text-primary); }
  .workspace-list { flex:1; overflow-y:auto; padding:6px; }
  .workspace-list::-webkit-scrollbar { width:4px; }
  .workspace-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

  .workspace-item { padding:8px 10px; border-radius:8px; cursor:pointer; transition:all 0.15s; margin-bottom:2px; border:1.5px solid transparent; }
  .workspace-item:hover { background:var(--bg-tertiary); }
  .workspace-item.active { background:var(--bg-secondary); border-color:var(--border); }
  .workspace-item.attention { border-color:var(--ring-blue); box-shadow:0 0 12px var(--ring-glow); animation:pulse-ring 2s ease-in-out infinite; }
  @keyframes pulse-ring { 0%,100%{box-shadow:0 0 8px var(--ring-glow)} 50%{box-shadow:0 0 16px var(--ring-glow)} }

  .ws-header { display:flex; align-items:center; gap:8px; margin-bottom:2px; }
  .ws-indicator { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .ws-indicator.active { background:var(--green); box-shadow:0 0 6px rgba(63,185,80,0.5); }
  .ws-indicator.idle { background:var(--text-muted); }
  .ws-indicator.waiting { background:var(--accent); box-shadow:0 0 6px var(--accent-glow); animation:blink 1.5s ease-in-out infinite; }
  .ws-indicator.error { background:var(--red); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .ws-name { font-size:13px; font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ws-badge { font-size:10px; padding:1px 6px; border-radius:10px; font-weight:600; }
  .ws-badge.unread { background:var(--accent); color:#000; }
  .ws-meta { padding-left:16px; }
  .ws-meta-row { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-secondary); }
  .ws-meta-row svg { width:12px; height:12px; flex-shrink:0; opacity:0.6; }
  .ws-meta-row .branch { color:var(--purple); font-family:'Cascadia Code','Consolas',monospace; font-size:11px; }
  .ws-meta-row .agent { color:var(--cyan); }
  .ws-notification { margin-top:3px; padding:3px 6px; background:rgba(88,166,255,0.08); border-left:2px solid var(--accent); border-radius:0 4px 4px 0; font-size:11px; color:var(--text-secondary); margin-left:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .sidebar-footer { padding:8px 14px; border-top:1px solid var(--border); font-size:11px; color:var(--text-muted); display:flex; justify-content:space-between; }
  .sidebar-footer .agent-count { display:flex; gap:8px; }
  .sidebar-footer .stat { display:flex; align-items:center; gap:4px; }
  .sidebar-footer .dot { width:6px; height:6px; border-radius:50%; }
  .sidebar-footer .dot.running { background:var(--green); }
  .sidebar-footer .dot.waiting { background:var(--accent); }

  /* MAIN */
  .main { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }

  /* PANE GRID — recursive split tree container */
  .pane-grid { flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative; }
  .pane-node { display:flex; overflow:hidden; min-width:0; min-height:0; }
  .pane-node.horizontal { flex-direction:row; }
  .pane-node.vertical { flex-direction:column; }
  
  .pane-leaf { flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative; min-width:0; min-height:0; border:1px solid var(--border); background:var(--bg-primary); }
  .pane-leaf.focused { border-color:var(--accent); }
  .pane-leaf.waiting { border-color:var(--ring-blue); box-shadow:0 0 0 2px var(--ring-blue),0 0 14px var(--ring-glow); animation:wmux-pulse 2s ease-in-out infinite; }
  @keyframes wmux-pulse { 0%,100%{box-shadow:0 0 0 2px var(--ring-blue),0 0 14px var(--ring-glow)} 50%{box-shadow:0 0 0 2px var(--ring-blue),0 0 6px var(--ring-glow)} }
  
  .resize-handle { flex-shrink:0; background:var(--border); transition:background 0.15s; z-index:10; }
  .resize-handle:hover, .resize-handle.active { background:var(--accent); }
  .resize-handle.horizontal { width:5px; min-width:5px; cursor:col-resize; }
  .resize-handle.vertical { height:5px; min-height:5px; cursor:row-resize; }
  .pane-header { display:flex; align-items:center; justify-content:space-between; padding:3px 8px; background:var(--bg-secondary); border-bottom:1px solid var(--border); font-size:11px; color:var(--text-secondary); min-height:24px; flex-shrink:0; }
  .pane-header-left { display:flex; align-items:center; gap:6px; }
  .agent-badge { display:inline-flex; padding:1px 6px; border-radius:4px; font-size:10px; font-weight:600; }
  .agent-badge.term1 { background:rgba(188,140,255,0.15); color:var(--purple); }
  .agent-badge.term2 { background:rgba(63,185,80,0.15); color:var(--green); }
  .agent-badge.term3 { background:rgba(88,166,255,0.15); color:var(--accent); }
  .agent-badge.agent { background:rgba(57,211,83,0.15); color:var(--cyan); }
  .agent-badge.browser { background:rgba(240,136,62,0.15); color:var(--orange); }
  .pane-cwd { color:var(--text-muted); font-family:'Cascadia Code',monospace; font-size:10px; opacity:0.7; }
  .pane-close-btn { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:13px; padding:2px 6px; border-radius:4px; transition:all 0.15s; opacity:0.7; }
  .pane-leaf:hover .pane-close-btn { opacity:1; }
  .pane-close-btn:hover { background:var(--red); color:#fff; }

  /* xterm fills the pane */
  .xterm-container { flex:1; overflow:hidden; min-height:0; }
  .xterm-container .xterm { height:100% !important; }
  .xterm-container .xterm-viewport { overflow-y:auto !important; }
  .xterm-container .xterm-viewport::-webkit-scrollbar { width:6px; }
  .xterm-container .xterm-viewport::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  .xterm-container .xterm-screen { height:100% !important; }

  /* Browser pane */
  .browser-pane { flex:1; border:none; background:#fff; }
  .browser-pane iframe { width:100%; height:100%; border:none; }

  /* Status bar */
  .status-bar { display:flex; align-items:center; justify-content:space-between; height:22px; padding:0 10px; background:var(--bg-secondary); border-top:1px solid var(--border); font-size:11px; color:var(--text-muted); flex-shrink:0; }
  .status-left,.status-right { display:flex; align-items:center; gap:10px; }
  .status-item { display:flex; align-items:center; gap:4px; }
  .status-item .dot { width:5px; height:5px; border-radius:50%; }
  .kbd { display:inline-block; padding:1px 4px; background:var(--bg-tertiary); border:1px solid var(--border); border-radius:3px; font-size:10px; font-family:'Cascadia Code',monospace; color:var(--text-secondary); }

  /* Toast */
  #toast-container { position:fixed; top:50px; right:16px; z-index:2000; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  .notification-toast { background:var(--bg-secondary); border:1px solid var(--accent); border-radius:10px; padding:12px 16px; max-width:340px; box-shadow:0 8px 32px rgba(0,0,0,0.5),0 0 16px var(--ring-glow); animation:slide-in 0.3s ease-out; pointer-events:auto; }
  @keyframes slide-in { from{transform:translateX(100px);opacity:0} to{transform:translateX(0);opacity:1} }
  .notification-toast .toast-header { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .notification-toast .toast-title { font-size:12px; font-weight:600; color:var(--accent); flex:1; }
  .notification-toast .toast-close { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:12px; }
  .notification-toast .toast-body { font-size:12px; color:var(--text-secondary); }
  .notification-toast .toast-meta { font-size:10px; color:var(--text-muted); margin-top:4px; }

  /* Command palette */
  #command-palette { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:3000; align-items:flex-start; justify-content:center; padding-top:80px; }
  .palette-box { background:var(--bg-secondary); border:1px solid var(--border); border-radius:12px; width:520px; max-height:400px; display:flex; flex-direction:column; box-shadow:0 16px 64px rgba(0,0,0,0.6); overflow:hidden; }
  .palette-input { background:transparent; border:none; border-bottom:1px solid var(--border); padding:14px 16px; font-size:14px; color:var(--text-primary); outline:none; font-family:inherit; }
  .palette-input::placeholder { color:var(--text-muted); }
  #palette-results { flex:1; overflow-y:auto; padding:4px; }
  .palette-item { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-radius:6px; cursor:pointer; font-size:13px; color:var(--text-secondary); }
  .palette-item:hover,.palette-item.selected { background:var(--bg-tertiary); color:var(--text-primary); }
  .palette-shortcut { font-size:11px; color:var(--text-muted); font-family:'Cascadia Code',monospace; }
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        WMUX
      </div>
      <div class="sidebar-actions">
        <button title="New Workspace (Ctrl+N)" onclick="promptNewWorkspace()">＋</button>
        <button title="Command Palette (Ctrl+Shift+P)" onclick="toggleCommandPalette()">⌘</button>
      </div>
    </div>
    <div class="workspace-list" id="workspace-list"></div>
    <div class="sidebar-footer">
      <div class="agent-count" id="sidebar-footer-stats"></div>
      <span>v0.1.0</span>
    </div>
  </div>

  <!-- MAIN — recursive split-pane canvas -->
  <div class="main">
    <div class="pane-grid" id="pane-grid">
      <!-- Panes are created dynamically by panes.js -->
    </div>

    <!-- Status bar -->
    <div class="status-bar">
      <div class="status-left" id="status-left">
        <span id="status-active-workspace">wmux</span>
      </div>
      <div class="status-right">
        <span><span class="kbd">Ctrl</span>+<span class="kbd">Shift</span>+<span class="kbd">P</span> commands</span>
        <span>│</span>
        <span><span class="kbd">Ctrl</span>+<span class="kbd">B</span> sidebar</span>
        <span>│</span>
        <span><span class="kbd">Ctrl</span>+<span class="kbd">D</span> split · <span class="kbd">Ctrl</span>+<span class="kbd">W</span> close</span>
      </div>
    </div>
  </div>
</div>
<!-- Toast container -->
<div id="toast-container"></div>

<!-- Command palette -->
<div id="command-palette" onclick="if(event.target===this)toggleCommandPalette()">
  <div class="palette-box">
    <input class="palette-input" placeholder="Type a command..." oninput="renderPaletteResults(this.value)" autofocus>
    <div id="palette-results"></div>
  </div>
</div>

<script src="app.js"></script>
<script src="panes.js"></script>
<script src="terminal.js"></script>
</body>
</html>
