[package]
name = "wmux"
version = "0.1.0"
description = "cmux-style AI agent terminal multiplexer for Windows"
authors = ["DeliberateEnsemble"]
license = "GPL-3.0-or-later"
repository = "https://github.com/vortsghost2025/wmux-"
edition = "2021"
rust-version = "1.77.2"
default-run = "wmux"

[lib]
name = "wmux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wmux-cli"
path = "src/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
# Phase 2: walkdir = "2"
# Phase 2: regex = "1"

# PTY support (conpty on Windows, Unix PTY on Linux/Mac)
portable-pty = "0.8"

# IPC named pipe support
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Security",
], cfg = "target_os = \"windows\"" }

# Filesystem watcher for Wave bridge
# notify = "7"

# Standard directories
# dirs = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
